<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-text {
            font-size: 50%;
        }
    </style>
</head>
<body class="p-2">
<h2 class="fw-bold">Responsive Image Gallery</h2>
<p>Resize the browser window to see the effect.</p>
<div class="container">
    <div class="row g-1">
        <!-- Ảnh 1 -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100">
                <a href="img_mountains.jpg" target="_blank">
                    <img src="img_mountains.jpg" class="card-img-top img-fluid" alt="...">
                </a>
                <div class="card-body text-center">
                    <p class="card-text">Add a description of the image here</p>
                </div>
            </div>
        </div>

        <!-- Ảnh 2 -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100">
                <a href="img_lights.jpg" target="_blank">
                    <img src="img_lights.jpg" class="card-img-top img-fluid" alt="...">
                </a>
                <div class="card-body text-center">
                    <p class="card-text">Add a description of the image here</p>
                </div>
            </div>
        </div>

        <!-- Ảnh 3 -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100">
                <a href="img_forest.jpg" target="_blank">
                    <img src="img_forest.jpg" class="card-img-top img-fluid" alt="...">
                </a>
                <div class="card-body text-center">
                    <p class="card-text">Add a description of the image here</p>
                </div>
            </div>
        </div>

        <!-- Ảnh 4 -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card h-100">
                <a href="img_fjords.jpg" target="_blank">
                    <img src="img_fjords.jpg" class="card-img-top img-fluid" alt="...">
                </a>
                <div class="card-body text-center">
                    <p class="card-text">Add a description of the image here</p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
